name: Security

on:
  schedule:
    # Weekly, Mondays 06:00 UTC — catches advisories published after the fact.
    - cron: "0 6 * * 1"
  push:
    paths:
      - "uv.lock"
      - "pyproject.toml"
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Audit dependencies (OSV)
        # `--locked` fails if the lockfile would change; the preview flag
        # silences uv's "experimental command" warning.
        run: uv audit --locked --preview-features audit-command
