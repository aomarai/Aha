name: Security

on:
  schedule:
    # Weekly, Mondays 06:00 UTC — catches advisories published after the fact.
    - cron: "0 6 * * 1"
  push:
    paths:
      - "uv.lock"
      - "pyproject.toml"
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Audit dependencies (OSV)
        # `--locked` fails if the lockfile would change; the preview flag
        # silences uv's "experimental command" warning.
        run: uv audit --locked --preview-features audit-command
