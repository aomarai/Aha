name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # A real PostgreSQL for tests/test_postgres_integration.py (skipped when this is unset). Pinned
    # by digest like the Docker base images; Dependabot's docker ecosystem does not see workflow
    # files, so bump it with the Dockerfile's images.
    services:
      postgres:
        image: postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AHA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-python: true
          # A pull request's cache is visible to that pull request only, so only main saves one;
          # every pull request restores it (the Actions cache is free up to 10 GB per repository).
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      # pre-commit's hook environments (gitleaks is a Go build) and the mypy and ruff caches. Each
      # tool checks its own cache against the files, so a cache from an older commit is safe.
      - name: Restore the lint and type-check caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pre-commit
            .mypy_cache
            .ruff_cache
          key: lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Run pre-commit hooks (hygiene + secret scanning)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check (mypy)
        run: uv run mypy

      - name: Run tests (pytest)
        run: uv run pytest -q

      - name: Save the lint and type-check caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pre-commit
            .mypy_cache
            .ruff_cache
          key: lint-${{ runner.os }}-${{ github.sha }}

  # Pull requests run incrementally: they restore their own last campaign, or else the one the last
  # push to main saved, and re-test only the mutants the change can affect (mutmut's per-function
  # hashes, plus scripts/mutation_invalidate.py for test edits, new tests and stale copies). A push
  # to main always runs the full campaign from scratch and saves it, so the cache never drifts
  # from a real run for longer than one merge.
  mutation-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The incremental run diffs against the commit the cached campaign was built from.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-python: true
          # A pull request's cache is visible to that pull request only, so only main saves one;
          # every pull request restores it (the Actions cache is free up to 10 GB per repository).
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      # This pull request's previous run first (a cache is only visible to its own ref and the base
      # branch), then main's.
      - name: Restore the last campaign
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: mutmut-${{ runner.os }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            mutmut-${{ runner.os }}-pr${{ github.event.pull_request.number }}-
            mutmut-${{ runner.os }}-main-

      - name: Reset the cached results this change can affect
        if: github.event_name == 'pull_request'
        run: uv run python scripts/mutation_invalidate.py

      - name: Run mutation tests (mutmut)
        id: mutmut
        run: uv run mutmut run

      - name: Export mutation stats
        run: uv run mutmut export-cicd-stats

      - name: Gate on mutation score
        run: uv run python scripts/mutation_score.py

      # Small (about 16 MB). Main's is the baseline for every pull request; a pull request's is
      # reused by its own next push. Saved whenever the campaign finished, even if the gate then
      # failed: the verdicts are still right, and the fixing push starts from them.
      - name: Save the campaign
        if: ${{ !cancelled() && steps.mutmut.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: >-
            mutmut-${{ runner.os }}-${{ github.event_name == 'pull_request'
            && format('pr{0}', github.event.pull_request.number) || 'main' }}-${{ github.sha }}
