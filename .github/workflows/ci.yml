name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Run pre-commit hooks (hygiene + secret scanning)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check (mypy)
        run: uv run mypy

      - name: Run tests (pytest)
        run: uv run pytest -q

  mutation-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run mutation tests (mutmut)
        run: uv run mutmut run

      - name: Export mutation stats
        run: uv run mutmut export-cicd-stats

      - name: Gate on mutation score
        run: uv run python scripts/mutation_score.py
