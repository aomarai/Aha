name: Publish

# Builds the production image and pushes it to GHCR (ghcr.io/aomarai/aha) with the workflow's
# own GITHUB_TOKEN, so there is no long-lived registry secret.
#
#   push to main      -> builds sha-<short>                (immutable; one per commit)
#   push of tag vX.Y.Z -> X.Y.Z, X.Y, latest (latest only for a final release) are added to the
#                        image main already built for that commit: nothing is rebuilt, so the
#                        release is the exact digest that ran on staging.
#
# Pull requests never publish (this workflow does not run for them, so forks cannot either).
# Verification of the build itself happens on every PR in image.yml. See docs/releasing.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A main build is keyed by its commit, so a newer push never replaces a pending build (every commit
# that may be tagged gets its image). Releases share one group and run one at a time, so an older
# release cannot move the X.Y and latest aliases after a newer one.
concurrency:
  group: publish-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The only job that can write packages.
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.retag.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository is "aomarai/Aha" but image names must be lowercase.
      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read the package version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/aha/__init__.py)"
          [ -n "$version" ] || { echo "could not read __version__" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A release tag must name the version in the code, or the image would be mislabelled.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ "$TAG" = "v${VERSION}" ] || {
            echo "tag ${TAG} does not match aha.__version__ (${VERSION}); bump it in the release PR" >&2
            exit 1
          }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # The image reports the version in the code (the release is this same image).
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # No `edge` or branch tags: every published tag is either immutable (sha, X.Y.Z)
          # or a deliberate pointer to the newest release (X.Y, latest).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # A release adds tags to the image main already built for this commit; it never rebuilds
      # (a rebuild would be a different digest from the one that was tested, and would move the
      # immutable sha-<short> tag). It fails if that image is missing or is not this version.
      - name: Retag the tested image
        id: retag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          short="sha-${COMMIT:0:7}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${short}" --format '{{.Manifest.Digest}}')" || {
            echo "no image ${IMAGE}:${short}: the main build of this commit must finish first" >&2
            exit 1
          }
          # An index with attestations holds one config per platform, so search all of them.
          env_json="$(docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .Image}}')"
          echo "$env_json" | grep -q "AHA_VERSION=${VERSION}\"" || {
            echo "image ${digest} was not built as version ${VERSION}" >&2
            exit 1
          }
          echo "$env_json" | grep -q "AHA_COMMIT=${COMMIT}\"" || {
            echo "image ${digest} was not built from commit ${COMMIT}" >&2
            exit 1
          }
          # A release tag is never moved: a re-run after a partial failure must name the same digest.
          existing="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$digest" ]; then
            echo "${IMAGE}:${VERSION} already names ${existing}, not ${digest}; ship a new patch version" >&2
            exit 1
          fi
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${digest}"
          # imagetools writes tags one by one: check that every one landed (re-run the job if not).
          while read -r tag; do
            [ -n "$tag" ] || continue
            got="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            [ "$got" = "$digest" ] || { echo "$tag is ${got}, expected ${digest}" >&2; exit 1; }
          done <<< "$TAGS"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # amd64 only: that is what the homelab runs. Add a platform here when a real need appears.
      - name: Build and push
        id: build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AHA_VERSION=${{ steps.version.outputs.version }}
            AHA_COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          # Read-only: image.yml writes this cache on every push to main.
          cache-from: type=gha,scope=aha-image

      - name: Summarise the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest || steps.retag.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Reference by digest (immutable):"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags:"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
