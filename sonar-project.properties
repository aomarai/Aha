# SonarQube analysis configuration.
# The project key must match the project created in the SonarQube UI; the repo
# is imported through the GitHub App integration so PRs are bound correctly.
sonar.projectKey=aomarai_Aha
sonar.projectName=Aha

sonar.sources=src
sonar.tests=tests

sonar.sourceEncoding=UTF-8

# Not pinned yet: the analyzer's supported-version list lags the interpreter in
# .python-version (3.15), and an unsupported value fails analysis. Replace this
# with e.g. sonar.python.version=3.13 once the running SonarQube reports the
# version you deploy.

# Test coverage is not wired up yet. To add it: put `pytest-cov` in the dev
# dependency group, run `uv run pytest --cov=aha --cov-report=xml`, and uncomment
# sonar.python.coverage.reportPaths=coverage.xml
