# SonarQube analysis configuration.
# The project key must match the project created in the SonarQube UI. The repo
# is imported through the GitHub App integration, which assigns the key below
# and binds the project to github.com/aomarai/Aha; the CI project analysis token
# is scoped to that project, so analysing under any other key is rejected.
# The same key is used for SonarQube for IDE connected mode in
# .devcontainer/sonar-project.properties — keep the two in sync.
sonar.projectKey=aomarai_Aha_b5802f94-d481-4d0f-99fc-841310f2f7c2
sonar.projectName=Aha
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# Not pinned yet: the analyzer's supported-version list lags the interpreter in
# .python-version (3.15), and an unsupported value fails analysis. Replace this
# with e.g. sonar.python.version=3.13 once the running SonarQube reports the
# version you deploy.
# Coverage: the SonarQube job runs `uv run pytest --cov=aha --cov-report=xml`
# before the scan (see .github/workflows/sonarqube.yml), leaving a Cobertura
# report at the repo root that the scanner reads to compute the coverage measure
# behind the README badge.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.14.5
