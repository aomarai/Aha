# Pre-commit hooks for local quality gates.
#
# Install once:  uv run pre-commit install
# Run on all files:  uv run pre-commit run --all-files
# Update pins:  uv run pre-commit autoupdate
#
# Ruff runs via `uv run` so the hook uses exactly the version pinned in the
# lockfile (no drift between local hooks and CI).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Secret scanning: catches a leaked DISCORD_BOT_TOKEN before it is committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # .gitleaks.toml extends the default rules and allowlists the public
        # SonarQube project key, which would otherwise trip `generic-api-key`.
        args: ["--config", ".gitleaks.toml"]
