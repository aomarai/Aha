[project]
name = "aha"
version = "0.1.0"
description = "Aha - a Discord bot (Python, discord.py, uv)."
readme = "README.md"
authors = [
    { name = "Ash Omaraie" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.1.0",
]

[project.scripts]
aha = "aha.__main__:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=aha --cov-report=term-missing --cov-fail-under=95"

# Coverage config. The SonarQube job additionally passes `--cov-report=xml` on
# top of these addopts so the scanner can read the Cobertura report behind the
# README badge.
[tool.coverage.run]
branch = true
source = ["aha"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
