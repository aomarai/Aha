[project]
name = "aha"
version = "0.1.0"
description = "Aha - a Discord bot (Python, discord.py, uv)."
readme = "README.md"
authors = [
    { name = "Ash Omaraie" }
]
# Upper bound is deliberate: PyYAML 6.0.3 publishes no cp315 wheel, so on 3.15
# uv falls back to building its sdist, which crashes on Windows (0xC0000005)
# and silently drops the C extension elsewhere.
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.10",
    "asyncpg>=0.30",
    "discord-py>=2.7.1",
    "prometheus-client>=0.21",
    "python-dotenv>=1.1.0",
    "tzdata>=2025.2",
]

[project.scripts]
aha = "aha.__main__:cli"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pre-commit>=4.0",
    "pytest>=9.2.0",
    "pytest-cov>=6.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=aha --cov-report=term-missing --cov-fail-under=95"

# Mutation testing (mutmut). `--no-cov` is required: pytest's `--cov-fail-under=95`
# would otherwise make every mutant's run exit non-zero on *coverage*, so mutmut
# could not distinguish a killed mutant from an un-covered one. The mutation
# campaign is scoped to the hand-written package; tests are selected from tests/.
# `also_copy` must include scripts/ so the copy of the repo that mutmut runs the
# tests in contains the gate module that tests/test_mutation_score.py imports
# (mutmut copies tests/, pyproject.toml and the lockfiles by default).
[tool.mutmut]
source_paths = ["src/aha"]
also_copy = ["scripts/", "pyproject.toml"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov", "-q", "-p", "no:cacheprovider"]

# Coverage config. The SonarQube job additionally passes `--cov-report=xml` on
# top of these addopts so the scanner can read the Cobertura report behind the
# README badge.
[tool.coverage.run]
branch = true
source = ["aha"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
