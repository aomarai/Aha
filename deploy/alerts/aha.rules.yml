# Prometheus alerting rules for Aha. Load with `rule_files:` or wrap in a PrometheusRule.
#
# Only metrics that exist today are alerted on. An alert for REST 429s ships with the issue that
# adds that metric (see the roadmap, #20).
groups:
  - name: aha
    rules:
      - alert: AhaShardNotReady
        expr: min by (shard) (aha_shard_ready) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Shard {{ $labels.shard }} has not been ready for 5 minutes"
          description: >-
            The gateway connection is down or never finished starting. Check the pod logs for
            gateway disconnects and the watchdog's CRITICAL line.

      - alert: AhaReadinessFlapping
        expr: changes(aha_shard_ready[30m]) > 4
        labels:
          severity: warn
        annotations:
          summary: "Shard {{ $labels.shard }} readiness changed {{ $value }} times in 30 minutes"

      - alert: AhaReconnectStorm
        expr: increase(aha_gateway_reconnects_total[10m]) > 5
        labels:
          severity: warn
        annotations:
          summary: "Shard {{ $labels.shard }} disconnected {{ $value }} times in 10 minutes"
          description: >-
            Repeated disconnects. A crash loop also spends the daily session-start budget.

      - alert: AhaCommandErrorRate
        expr: >-
          sum(rate(aha_commands_total{outcome="error"}[15m]))
          / sum(rate(aha_commands_total[15m])) > 0.05
          and sum(rate(aha_commands_total[15m])) > 0.02
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "More than 5% of commands are failing with unexpected errors"

      - alert: AhaSchedulerLag
        expr: max(aha_scheduler_lag_seconds) > 120
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Scheduled jobs are running more than two minutes late"
          description: >-
            Due jobs (reminders and similar) are not being claimed. Check that a pod is running the
            scheduler task, the database is reachable, and handlers are not timing out.

      - alert: AhaSessionBudgetLow
        expr: min(aha_session_start_remaining / aha_session_start_total) < 0.2
        labels:
          severity: page
        annotations:
          summary: "Under 20% of today's Discord gateway sessions remain"
          description: >-
            Every pod restart spends a gateway session and the budget resets once a day. Look for
            a crash loop (AhaReconnectStorm, pod restarts). Below the configured floor
            (SESSION_START_FLOOR, default 10%) pods stop identifying and wait for the reset; see
            docs/runbooks/session-budget.md.
